name: CI – Chat Service

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened

  push:
    branches:
      - develop

env:
  JAVA_VERSION: '21'

jobs:

  # =========================================================
  # CI – BUILD, TEST & COVERAGE
  # =========================================================
  build-and-test:
    name: "CI – Build & Test"
    runs-on: ubuntu-latest

    steps:

      # =========================================
      # Checkout repository
      # =========================================
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================================
      # Configure Java + Maven cache
      # =========================================
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # =========================================
      # Compile + Run Tests + JaCoCo
      # =========================================
      - name: Run tests
        env:
          SPRING_PROFILES_ACTIVE: test
          MONGO_URI: ${{ secrets.MONGO_URI_TEST }}
        run: mvn clean verify -B

      # =========================================
      # Upload JaCoCo coverage report
      # =========================================
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

      # =========================================
      # Upload Surefire reports
      # =========================================
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 14

  # =========================================================
  # DOCKER VALIDATION
  # =========================================================
  docker-build:
    name: "Docker – Build Validation"
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:

      # =========================================
      # Checkout repository
      # =========================================
      - name: Checkout code
        uses: actions/checkout@v4

      # =========================================
      # Validate required secret
      # =========================================
      - name: Validate SSL secret
        env:
          SSL_KEY_STORE_PASSWORD: ${{ secrets.SSL_KEY_STORE_PASSWORD }}
        run: |
          if [ -z "$SSL_KEY_STORE_PASSWORD" ]; then
            echo "ERROR: SSL_KEY_STORE_PASSWORD is empty"
            exit 1
          else
            echo "SSL secret loaded correctly"
          fi

      # =========================================
      # Validate Docker build
      # =========================================
      - name: Build Docker image
        env:
          SSL_KEY_STORE_PASSWORD: ${{ secrets.SSL_KEY_STORE_PASSWORD }}
        run: |
          docker build \
            --build-arg SSL_KEY_STORE_PASSWORD="$SSL_KEY_STORE_PASSWORD" \
            -t chat-service:ci .
