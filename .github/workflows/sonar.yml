name: QA – Sonar Analysis

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened

  push:
    branches:
      - develop
      - main

env:
  JAVA_VERSION: '21'

jobs:

  sonar:
    name: "QA – Sonar Analysis"
    runs-on: ubuntu-latest

    steps:

      # =========================================
      # Checkout repository
      # =========================================
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================================
      # Configure Java + Maven cache
      # =========================================
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # =========================================
      # Run SonarCloud analysis
      # =========================================
      - name: Run Sonar Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          MONGO_URI: ${{ secrets.MONGO_URI_TEST }}
          SPRING_PROFILES_ACTIVE: test

        run: mvn clean verify sonar:sonar -B
