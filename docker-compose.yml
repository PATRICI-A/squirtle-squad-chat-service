services:

  redis:
    image: redis:7-alpine
    container_name: patricia-redis
    restart: unless-stopped
    networks:
      - patricia-network

  auth-service:
    build:
      context: ../snorlax-energy-auth-service
      dockerfile: Dockerfile
    container_name: patricia-auth-service
    ports:
      - "9090:9090"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - PORT=9090
      - SERVER_PORT=9090
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=900000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_SSL=false
      - MAIL_DEV_MODE=false
      - MAIL_HOST=smtp.gmail.com
      - MAIL_PORT=587
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - USER_SERVICE_URL=http://44.203.135.235:8080
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - patricia-network

  chat-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: squirtle-chat-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb+srv://ders14028_db_user:ders210021@cluster0.1p8nobv.mongodb.net/patricia_chat?retryWrites=true&w=majority&appName=Cluster0
      - SPRING_DATA_MONGODB_DATABASE=patricia_chat
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://auth-service:9090
      - PARCHE_SERVICE_URL=http://44.203.135.235:8080
    depends_on:
      - auth-service
    restart: on-failure
    networks:
      - patricia-network

networks:
  patricia-network:
    driver: bridge
    name: patricia-network