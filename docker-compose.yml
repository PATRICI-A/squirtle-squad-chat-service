feature/setup-devops
version: '3.8'

services:
  chat-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: squirtle-chat-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/squirtle_db
      - SPRING_DATASOURCE_USERNAME=squirtle_user
      - SPRING_DATASOURCE_PASSWORD=squirtle_pass
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      - postgres
      - rabbitmq

  notification-service:
    # Esqueleto inicial - Reemplazar con 'build: context: ../notification-service' cuando exista
    image: alpine:latest
    container_name: squirtle-notification-service
    command: tail -f /dev/null
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/squirtle_db
      - SPRING_DATASOURCE_USERNAME=squirtle_user
      - SPRING_DATASOURCE_PASSWORD=squirtle_pass
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_REDIS_HOST=redis
    depends_on:
      - postgres
      - redis
      - rabbitmq

  connection-service:
    # Esqueleto inicial - Reemplazar con 'build: context: ../connection-service' cuando exista
    image: alpine:latest
    container_name: squirtle-connection-service
    command: tail -f /dev/null
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/squirtle_db
      - SPRING_DATASOURCE_USERNAME=squirtle_user
      - SPRING_DATASOURCE_PASSWORD=squirtle_pass
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    container_name: squirtle-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: squirtle_db
      POSTGRES_USER: squirtle_user
      POSTGRES_PASSWORD: squirtle_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: squirtle-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: squirtle-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres_data:

services:

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: patricia-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    networks:
      - patricia-network

  notification-service:
    build:
      context: ../squirtle-squad-notification-service-1
      dockerfile: Dockerfile
    container_name: patricia-notification-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
      - SPRING_MAIL_USERNAME=${MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${MAIL_PASSWORD}
    depends_on:
      - rabbitmq
    restart: on-failure
    networks:
      - patricia-network

  redis:
    image: redis:7-alpine
    container_name: patricia-redis
    restart: unless-stopped
    networks:
      - patricia-network

  auth-service:
    build:
      context: ../snorlax-energy-auth-service
      dockerfile: Dockerfile
    container_name: patricia-auth-service
    ports:
      - "9090:9090"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - PORT=9090
      - SERVER_PORT=9090
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=900000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_SSL=false
      - MAIL_DEV_MODE=true
      - NOTIFICATION_RABBITMQ_ENABLED=true
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
      - USER_SERVICE_URL=http://44.203.135.235:8080
    depends_on:
      - redis
      - rabbitmq
    restart: unless-stopped
    networks:
      - patricia-network

  chat-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: squirtle-chat-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb+srv://ders14028_db_user:ders210021@cluster0.1p8nobv.mongodb.net/patricia_chat?retryWrites=true&w=majority&appName=Cluster0
      - SPRING_DATA_MONGODB_DATABASE=patricia_chat
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://auth-service:9090
      - PARCHE_SERVICE_URL=http://44.203.135.235:8080
    depends_on:
      - auth-service
    restart: on-failure
    networks:
      - patricia-network

networks:
  patricia-network:
    driver: bridge
    name: patricia-network
    main
